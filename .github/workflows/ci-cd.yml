name: CI/CD Pipeline

# Runs on every push to main, on pull requests (build only, no deploy), and
# on demand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ===========================================================================
  # 01 — Lint
  # ===========================================================================
  lint:
    name: 01 · Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/

  # ===========================================================================
  # 02 — Test
  # ===========================================================================
  test:
    name: 02 · Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v

  # ===========================================================================
  # 03 — Build and push
  #
  # Only runs if lint and test both pass. Pull requests build the image to
  # prove it compiles, but skip the push.
  # ===========================================================================
  build:
    name: 03 · Build & push image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Record build timestamp
        id: build_time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
            IMAGE_TAG=${{ steps.meta.outputs.version }}
            APP_VERSION=1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the build
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Built at | ${{ steps.build_time.outputs.value }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 04 — Deploy
  #
  # Calls the Render deploy hook, which tells Render to pull the new image.
  # Skipped on pull requests: only main deploys.
  # ===========================================================================
  deploy:
    name: 04 · Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy triggered."

  # ===========================================================================
  # 05 — Verify
  #
  # Polls /health until the live service reports the commit we just shipped.
  # A deploy that never becomes reachable fails the pipeline instead of quietly
  # looking green.
  # ===========================================================================
  verify:
    name: 05 · Verify deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for the new commit to go live
        run: |
          APP_URL="${{ vars.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "APP_URL variable is not set. Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          EXPECTED="${{ github.sha }}"
          echo "Waiting for $APP_URL/health to report $EXPECTED"

          for attempt in $(seq 1 30); do
            RESPONSE=$(curl --silent --max-time 10 "$APP_URL/health" || echo "")

            if echo "$RESPONSE" | grep -q "$EXPECTED"; then
              echo "Live on attempt $attempt."
              {
                echo "### Deployment verified"
                echo ""
                echo "\`$EXPECTED\` is serving at $APP_URL"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Attempt $attempt/30 — not live yet, waiting 10s."
            sleep 10
          done

          echo "Timed out after 5 minutes. Check the Render logs."
          exit 1
