# Local development setup.
#
# Runs the same image the pipeline builds, so "works on my machine" and "works
# in production" mean the same thing.
#
#   docker compose up --build     start it
#   docker compose down           stop it
#
# Then open http://localhost:5000

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: local-dev
        BUILD_TIME: local
        IMAGE_TAG: local
        APP_VERSION: 0.0.0-local
    image: autonomous-deployment-demo:local
    container_name: deployment-demo
    ports:
      - "5000:5000"
    environment:
      APP_ENV: development
      PORT: 5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
